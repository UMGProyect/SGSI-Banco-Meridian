name: Seguridad y validacion IaC
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Probar politica de archivos
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py'
      - name: Verificar archivos rastreados e historial
        run: python3 scripts/security/check_tracked_files.py
      - name: Gitleaks - historial y arbol actual
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SCANNER: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
        run: |
          set -euo pipefail
          docker pull "$SCANNER"
          scan() {
            local output rc=0
            output=$(mktemp)
            docker run --rm --network none -v "$PWD:/repo:ro" \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
              "$SCANNER" "$@" --redact=100 --exit-code=42 --no-banner >/dev/null 2>"$output" || rc=$?
            rm -f "$output"
            if [ "$rc" -eq 42 ]; then
              echo "FAIL: posible secreto detectado; revisar localmente sin divulgarlo."
            elif [ "$rc" -ne 0 ]; then
              echo "ERROR: el escaner no finalizo correctamente (codigo $rc)."
            else
              echo "PASS: escaneo finalizado sin hallazgos."
            fi
            return "$rc"
          }
          history=0
          tree=0
          scan git --log-opts="--all HEAD" /repo || history=$?
          scan dir /repo || tree=$?
          test "$history" -eq 0 && test "$tree" -eq 0
  terraform-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infraestructura/gcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false
      - name: Inicializar sin backend ni credenciales cloud
        run: terraform init -backend=false -input=false -no-color
      - name: Validar configuracion
        run: terraform validate -no-color
  checkov-iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkov - revisar configuracion Terraform
        shell: bash
        env:
          SCANNER: ghcr.io/bridgecrewio/checkov:3.3.30@sha256:4b65e89f1fde292249fc0aa0d0db43302c036dfe39f7370b2d3517571082b894
        run: |
          set -euo pipefail
          docker pull "$SCANNER"
          report=$(mktemp)
          trap 'rm -f "$report"' EXIT
          rc=0
          docker run --rm --network none -v "$PWD/infraestructura/gcp:/tf:ro" \
            "$SCANNER" -d /tf --framework terraform --skip-download \
            --download-external-modules false --quiet --output json >"$report" 2>/dev/null || rc=$?
          python3 - "$report" "$rc" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
              summary = data["summary"]
              counts = {k: int(summary.get(k, 0)) for k in ("passed", "failed", "skipped", "parsing_errors")}
              print(counts)
              for check in data.get("results", {}).get("failed_checks", []):
                  identifier = check.get("check_id", "")
                  if identifier.startswith("CKV") and identifier.replace("_", "").isalnum():
                      print(identifier)
              if counts["passed"] + counts["failed"] + counts["skipped"] == 0 or counts["parsing_errors"]:
                  sys.exit(2)
              if counts["failed"] or int(sys.argv[2]):
                  sys.exit(1)
          except (ValueError, KeyError, TypeError, OSError):
              print("ERROR: no se pudo obtener un informe valido de Checkov.")
              sys.exit(2)
          PY
